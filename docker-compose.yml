version: '3.11'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./frames:/app/frames
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
